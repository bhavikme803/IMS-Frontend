<!DOCTYPE html>
<html style="font-family: roboto">
<head>
    <title>Admin Login</title>
    <link rel="icon" type="image/x-icon" href="https://thumbs.dreamstime.com/b/inventory-management-icon-monochrome-simple-sign-operation-collection-logo-templates-web-design-infographics-300229668.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="text-align: center;font-family: Roboto">Admin Login</h1>

    <form id="loginForm">
        <div class="container">
            <label for="uname"><b>Id</b></label>
            <input type="text" placeholder="Enter id" name="id" required>

            <label for="psw"><b>Password</b></label>
            <input type="password" placeholder="Enter Password" name="password" required>

            <button type="submit">Login</button>
        </div>

        <div class="container" style="background-color:#f1f1f1">
            <span class="psw"><a href="#">Forgot Password?</a></span>
        </div>
    </form>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const id = document.querySelector('input[name="id"]').value;
            const password = document.querySelector('input[name="password"]').value;

            try {
                const response = await fetch("https://ims-backend-au40.onrender.com//auth/login/admin", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        id: id,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem("adminId", data.adminId);
                    localStorage.setItem("username", data.name);
                    window.location.href = "admindashboard.html";
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Cannot connect to backend on localhost:8080");
                console.error(err);
            }
        });
    </script>
</body>
</html>
